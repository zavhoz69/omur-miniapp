<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ӨМҮР КЖ — Одна платформа, много возможностей</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Cormorant+Display:wght@600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Montserrat', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
                        display: ['Cormorant Display', 'serif'],
                    },
                }
            }
        }
    </script>

    <style>
        ::-webkit-scrollbar { display: none; }
        * { -webkit-tap-highlight-color: transparent; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }
        .delay-100 { animation-delay: 0.1s; }
        .delay-200 { animation-delay: 0.2s; }

        @keyframes emblemPulse {
            0%, 100% { transform: scale(1); opacity: 0.85; }
            50%      { transform: scale(1.08); opacity: 1; }
        }
        .animate-emblem-pulse {
            animation: emblemPulse 3.2s ease-in-out infinite;
        }

        @keyframes flyOut {
            0% {
                transform: translate(-50%, -50%) translate(0, 0) scale(0.3);
                opacity: 0;
            }
            8% {
                opacity: 1;
                transform: translate(-50%, -50%) translate(calc(var(--tx) * 0.08), calc(var(--ty) * 0.08)) scale(1.4);
            }
            15% {
                opacity: 1;
                transform: translate(-50%, -50%) translate(calc(var(--tx) * 0.15), calc(var(--ty) * 0.15)) scale(1.1);
            }
            75% {
                opacity: 0.95;
            }
            100% {
                transform: translate(-50%, -50%) translate(var(--tx), var(--ty)) scale(0.5);
                opacity: 0;
            }
        }
        .spark-fly {
            position: absolute;
            top: 50%;
            left: 50%;
            border-radius: 9999px;
            pointer-events: none;
            animation: flyOut var(--dur) ease-out infinite;
            animation-delay: var(--delay);
            background: radial-gradient(circle, #ffffff 0%, #ffffff 25%, #fffbe0 45%, #ffe680 65%, #ffc93c 85%, #d4af37 100%) !important;
            box-shadow: 0 0 4px #ffffff, 0 0 10px #ffffff, 0 0 18px #fffbe0, 0 0 28px #ffd75e, 0 0 40px #d4af37, 0 0 55px rgba(212,175,55,0.85) !important;
        }

        .glass-reflection, .glass-reflection-2, .glass-vignette, .gold-top-line {
            position: absolute; inset: 0; pointer-events: none; z-index: 6;
        }
        .glass-vignette {
            z-index: 7;
            background: radial-gradient(ellipse at center, transparent 0%, transparent 55%, rgba(0,0,0,0.2) 85%, rgba(0,0,0,0.35) 100%);
        }
        .gold-top-line {
            height: 2px; z-index: 41;
            background: linear-gradient(90deg, transparent 0%, rgba(212,175,55,0.4) 20%, rgba(245,230,163,0.7) 50%, rgba(212,175,55,0.4) 80%, transparent 100%);
        }

        .glass-emerald {
            position: relative;
            background: linear-gradient(135deg, rgba(16,60,45,0.55) 0%, rgba(6,30,22,0.35) 100%);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 2px solid rgba(212,175,55,0.7);
            background-clip: padding-box;
            box-shadow: 
                inset 0 1px 1px rgba(255,255,255,0.1),
                inset 0 -1px 1px rgba(0,0,0,0.3),
                0 0 15px rgba(212,175,55,0.45),
                0 8px 32px rgba(0,0,0,0.5);
            transition: transform 0.3s cubic-bezier(0.16,1,0.3,1);
        }
        .glass-emerald:active { transform: scale(0.98); }

        .glass-emerald-secondary {
            position: relative;
            background: linear-gradient(135deg, rgba(16,60,45,0.4) 0%, rgba(6,30,22,0.25) 100%);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 2px solid rgba(212,175,55,0.4);
            background-clip: padding-box;
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.06), 0 4px 20px rgba(0,0,0,0.4);
            transition: transform 0.3s cubic-bezier(0.16,1,0.3,1);
        }
        .glass-emerald-secondary:active { transform: scale(0.98); }

        .text-gold-gradient {
            background: linear-gradient(135deg, #f5e6a3 0%, #d4af37 50%, #b8941f 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .icon-gold { filter: drop-shadow(0 0 8px rgba(212,175,55,0.5)); }
        .gold-button { position: relative; overflow: hidden; cursor: pointer; }
        .gold-button::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 50%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.4) 0%, transparent 100%);
            border-radius: inherit; pointer-events: none;
        }
    </style>
</head>
<body class="bg-[#040d0a] w-full min-h-screen font-sans antialiased overflow-x-hidden text-white select-none">
    
    <!-- Фон -->
    <div class="fixed inset-0 pointer-events-none" style="background: radial-gradient(ellipse at 30% 30%, rgba(16,100,70,0.4) 0%, rgba(6,40,28,0.15) 40%, transparent 70%);"></div>
    <div class="glass-reflection"></div>
    <div class="glass-vignette"></div>
    <div class="gold-top-line"></div>

    <!-- Основной контент -->
    <div class="relative z-20 w-full max-w-md mx-auto px-4 pt-6 pb-24">
        
        <!-- Логотип и анимация -->
        <div class="relative text-center mb-8 animate-fade-in-up">
            <div class="relative flex justify-center">
                <div class="relative flex items-center justify-center" style="width: 300px; height: 300px;">
                    <div class="absolute w-[240px] h-[240px] rounded-full animate-emblem-pulse" style="background: radial-gradient(circle, rgba(245,230,163,0.35) 0%, rgba(212,175,55,0.15) 45%, transparent 70%); filter: blur(16px);"></div>
                    <div class="absolute w-[270px] h-[270px] rounded-full" style="border: 2px solid rgba(212,175,55,0.5); box-shadow: 0 0 22px rgba(212,175,55,0.6); z-index: 3;"></div>
                    <div class="absolute w-[320px] h-[320px] pointer-events-none" style="z-index: 4;">
                        <div class="spark-fly" style="--tx: 0px; --ty: -155px; --dur: 3.4s; --delay: 0s; width: 12px; height: 12px;"></div>
                        <div class="spark-fly" style="--tx: 155px; --ty: 0px; --dur: 3.2s; --delay: 1.1s; width: 12px; height: 12px;"></div>
                        <div class="spark-fly" style="--tx: 0px; --ty: 155px; --dur: 3.6s; --delay: 1.6s; width: 12px; height: 12px;"></div>
                        <div class="spark-fly" style="--tx: -155px; --ty: 0px; --dur: 3.7s; --delay: 1.4s; width: 12px; height: 12px;"></div>
                    </div>
                    <img src="logo.png" alt="ӨМҮР КЖ" class="relative w-[180px] h-[180px] object-contain" style="z-index: 5; filter: drop-shadow(0 0 14px rgba(212,175,55,0.85));">
                </div>
            </div>
        </div>

        <!-- Заголовки -->
        <div class="mb-6 animate-fade-in-up delay-100 text-center">
            <p class="text-white text-[18px] font-bold leading-snug mb-1">Бир платформа, <span class="text-gold-gradient font-bold">көп мүмкүнчүлүктөр</span></p>
            <p class="text-emerald-100/80 text-[18px] font-bold leading-snug">Одна платформа, много возможностей</p>
        </div>

        <!-- Карточка с кнопками -->
        <div class="glass-emerald relative rounded-2xl p-6 mb-5 animate-fade-in-up delay-200 overflow-hidden">
            <h2 class="text-white text-[19px] font-extrabold leading-tight mb-2 tracking-wide text-center break-all">@Gorod_Masterovkgbot</h2>
            <p class="text-emerald-100/80 text-[14px] font-semibold mb-6 leading-relaxed text-center">Бытовые услуги, транспорт, красота и ещё 13 категорий</p>

            <div class="flex flex-col gap-3">
                <!-- Кнопки -->
                <button type="button" onclick="sendAction('find_master')" class="gold-button group relative w-full py-3.5 px-5 rounded-xl font-bold text-[13px] tracking-wide text-neutral-900 bg-gradient-to-b from-amber-300 via-amber-400 to-amber-500 border border-amber-200/80 shadow-[0_4px_20px_rgba(245,158,11,0.4)] active:scale-[0.97] transition-all duration-200 ease-out flex items-center justify-center gap-2">
                    <span class="relative z-10 inline-flex items-center justify-center gap-2">НАЙТИ МАСТЕРА</span>
                </button>

                <button type="button" onclick="sendAction('register_master')" class="gold-button group relative w-full py-3.5 px-5 rounded-xl font-bold text-[13px] tracking-wide text-neutral-900 bg-gradient-to-b from-amber-300 via-amber-400 to-amber-500 border border-amber-200/80 shadow-[0_4px_20px_rgba(245,158,11,0.4)] active:scale-[0.97] transition-all duration-200 ease-out flex items-center justify-center gap-2">
                    <span class="relative z-10 inline-flex items-center justify-center gap-2">СТАТЬ МАСТЕРОМ</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Скрипт инициализации и отправки -->
    <script>
        // Функция отправки данных (без alert и без принудительного close)
        function sendAction(action) {
            console.log('Нажата кнопка, отправка:', action);
            if (window.Telegram && window.Telegram.WebApp) {
                try {
                    window.Telegram.WebApp.sendData(action);
                    console.log('Данные успешно отправлены:', action);
                } catch (e) {
                    console.error('Ошибка при sendData:', e);
                }
            } else {
                console.error('Telegram.WebApp недоступен!');
            }
        }

        // Инициализация WebApp
        window.addEventListener('load', () => {
            if (window.Telegram && window.Telegram.WebApp) {
                const tg = window.Telegram.WebApp;
                tg.ready();
                tg.expand();
                try {
                    tg.setHeaderColor('#040d0a');
                } catch (e) {
                    console.warn('setHeaderColor не поддерживается', e);
                }
                console.log('WebApp инициализирован. Версия:', tg.version);
            } else {
                console.error('Скрипт Telegram WebApp не загрузился.');
            }
        });
    </script>
</body>
</html>
